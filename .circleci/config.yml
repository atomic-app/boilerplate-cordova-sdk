version: 2.1

parameters:
  build_for_simulator:
    type: boolean
    default: false

orbs:
  macos: circleci/macos@2.5.2

executors:
  latest_xcode:
    macos:
      xcode: "26.2.0"
    resource_class: m4pro.medium

commands:
  inject_atomic_token:
    description: "Install JS deps, then generate a fresh Atomic JWT from the private key and inject it into www/js/index.js"
    steps:
      - run:
          name: Restore Atomic private key
          command: |
            if [ -z "$ATOMIC_PRIVATE_KEY" ]; then
              echo "ATOMIC_PRIVATE_KEY is not set."
              echo "Add it as a project environment variable (base64-encoded keys/atomic_private.pem, from 1Password) in CircleCI project settings, then re-run."
              exit 1
            fi
            mkdir -p keys
            echo "$ATOMIC_PRIVATE_KEY" | base64 --decode > keys/atomic_private.pem
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Generate and inject a fresh Atomic request token
          command: |
            TOKEN=$(node scripts/generate-token.js)
            perl -pi -e "s/(ATOMIC_REQUEST_TOKEN_STRING = ')[^']*(')/\$1${TOKEN}\$2/" www/js/index.js
            rm keys/atomic_private.pem

jobs:
  build_ios_simulator:
    executor: latest_xcode
    environment:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - macos/install-rosetta
      - checkout
      - inject_atomic_token
      - run:
          name: Add iOS platform
          command: npx cordova platform add ios@7.1.1
      - run:
          name: Build for iOS Simulator (unsigned)
          command: |
            xcodebuild \
              -workspace platforms/ios/HelloCordova.xcworkspace \
              -scheme HelloCordova \
              -sdk iphonesimulator \
              -configuration Debug \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              clean build
      - run:
          name: Zip the simulator app
          command: |
            cd build/Build/Products/Debug-iphonesimulator
            zip -r HelloCordova.app.zip HelloCordova.app
      - store_artifacts:
          path: build/Build/Products/Debug-iphonesimulator/HelloCordova.app.zip
          destination: HelloCordova.app.zip

  build_ios_device_ipa:
    executor: latest_xcode
    environment:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - macos/install-rosetta
      - checkout
      - run:
          name: Setup code signing
          command: |
            if [ -z "$IOS_CERTIFICATE" ] || [ -z "$IOS_CERTIFICATE_PASSWORD" ] || [ -z "$IOS_PROVISIONING_PROFILE" ]; then
              echo "IOS_CERTIFICATE, IOS_CERTIFICATE_PASSWORD and IOS_PROVISIONING_PROFILE must all be set as CircleCI project environment variables."
              exit 1
            fi

            echo "$IOS_CERTIFICATE" | base64 --decode > DevelopmentCertificate.p12

            PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
            mkdir -p "$PROFILE_DIR"
            PROFILE_PATH="$PROFILE_DIR/Development.mobileprovision"
            echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"

            # The provisioningProfiles hash in fastlane/Fastfile needs the profile's
            # display name, not its filename - pull it out of the profile itself so
            # there's no separate value to keep in sync by hand.
            PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -o - -)
            echo "export IOS_PROVISIONING_PROFILE_NAME='${PROFILE_NAME}'" >> "$BASH_ENV"
      - restore_cache:
          key: rbenv-ruby-3.3.6-{{ arch }}
      - run:
          # Workaround for Ruby 3.4 + fastlane, same as atomic-sdk-flutter's iOS setup.
          # rbenv install -s skips the from-source compile when the cache restore above
          # already populated ~/.rbenv/versions/3.3.6.
          #
          # Only the shims dir goes into BASH_ENV, not `eval "$(rbenv init - bash)"`.
          # rbenv is itself a bash script; putting the init eval in BASH_ENV means every
          # later non-interactive bash process - including the ones rbenv spawns
          # internally - re-sources BASH_ENV and re-runs it, recursively forking rbenv
          # until the VM runs out of processes.
          #
          # Deliberately not `rbenv global 3.3.6`: this image already has CocoaPods
          # installed under its own pre-existing Ruby (3.4.7), which `cordova platform
          # add ios` needs later for the push plugin's install hook. Changing the
          # global version would break `pod` for that step, so 3.3.6 is only ever
          # selected explicitly via RBENV_VERSION on the commands that need it.
          name: Use Ruby 3.3.x
          command: |
            HOMEBREW_NO_INSTALL_UPGRADE=1 brew install rbenv ruby-build
            eval "$(rbenv init - bash)"
            rbenv install -s 3.3.6
            RBENV_VERSION=3.3.6 gem install bundler -v 2.5.22
            echo 'export PATH="$HOME/.rbenv/shims:$PATH"' >> "$BASH_ENV"
      - save_cache:
          key: rbenv-ruby-3.3.6-{{ arch }}
          paths:
            - ~/.rbenv/versions/3.3.6
      - run:
          name: Install Ruby gems
          command: RBENV_VERSION=3.3.6 bundle install
      - inject_atomic_token
      - run:
          name: Add iOS platform
          command: npx cordova platform add ios@7.1.1
      - run:
          name: Build development-signed ipa
          command: RBENV_VERSION=3.3.6 bundle exec fastlane build_test_ipa
      - run:
          name: Clean up signing assets
          command: rm -f DevelopmentCertificate.p12
          when: always
      - store_artifacts:
          path: build/ipa/HelloCordova.ipa
          destination: HelloCordova.ipa

  build_android_debug:
    docker:
      - image: cimg/android:2026.07
    resource_class: large
    steps:
      - checkout
      - run:
          name: Install Node.js
          command: |
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y nodejs
      - run:
          # Project environment variable, not a context var - matches atomic-sdk-flutter's
          # initial_setup_android convention.
          name: Add Google services to App
          command: |
            if [ -z "$GOOGLE_SERVICES" ]; then
              echo "GOOGLE_SERVICES is not set."
              echo "Add it as a project environment variable (base64-encoded google-services.json) in CircleCI project settings, then re-run."
              exit 1
            fi
            echo "$GOOGLE_SERVICES" | base64 --decode > google-services.json
      - run:
          # cimg/android:2026.07 only ships Gradle 9.6.1, whose Groovy 4 runtime
          # can't resolve groovy.util.XmlParser - a class cordova-android 10.1.2's
          # own cordova.gradle uses directly, so its Gradle wrapper bootstrap step
          # fails with "unable to resolve class XmlParser" under the image's default
          # Gradle. cordova-android 10.1.2's own defaults (cdv-gradle-config-defaults.json)
          # pin Gradle 7.1.1 and AGP 4.2.2, so install and use exactly that instead -
          # not just "any pre-Groovy-4 Gradle" - to match what this cordova-android
          # release actually expects. AGP 4.2.2's era also expects JDK 8, not the
          # image's default JDK 21, so switch that too.
          name: Install Gradle 7.1.1 (matches cordova-android 10.1.2)
          command: |
            curl -fsSL https://services.gradle.org/distributions/gradle-7.1.1-bin.zip -o /tmp/gradle-7.1.1.zip
            sudo unzip -q -d /usr/local /tmp/gradle-7.1.1.zip
            rm /tmp/gradle-7.1.1.zip
            echo 'export PATH="/usr/local/gradle-7.1.1/bin:$PATH"' >> "$BASH_ENV"
            JAVA8_HOME=$(find /usr/lib/jvm -maxdepth 1 -iname "*java-8*" | head -1)
            if [ -z "$JAVA8_HOME" ]; then
              echo "No JDK 8 found under /usr/lib/jvm on this image - cimg/android:2026.07 was expected to ship one alongside 17/21."
              ls /usr/lib/jvm
              exit 1
            fi
            echo "export JAVA_HOME=$JAVA8_HOME" >> "$BASH_ENV"
      - run:
          # Same era mismatch as the Gradle/JDK step above: cimg/android:2026.07 only
          # ships build-tools 35.0.0+ and platforms android-34+, but cordova-android
          # 10.1.2's defaults (cdv-gradle-config-defaults.json) pin
          # MIN_BUILD_TOOLS_VERSION 30.0.3 and SDK_VERSION 30.
          name: Install Android build-tools 30.0.3 and platform android-30 (cordova-android 10.1.2's pin)
          command: yes | sdkmanager "platforms;android-30" "build-tools;30.0.3"
      - inject_atomic_token
      - run:
          name: Add Android platform
          command: npx cordova platform add android
      - run:
          name: Build debug APK
          command: npx cordova build android --debug
      - store_artifacts:
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          destination: app-debug.apk

workflows:
  build-apps:
    jobs:
      - build_ios_device_ipa
      - build_android_debug

  build_ios_simulator:
    when: << pipeline.parameters.build_for_simulator >>
    jobs:
      - build_ios_simulator
