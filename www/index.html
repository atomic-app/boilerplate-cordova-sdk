<html>
    <head>
        <meta charset="utf-8">
        <!--
        Customize this policy to fit your own app's needs. For more guidance, please refer to the docs:
            https://cordova.apache.org/docs/en/latest/
        Some notes:
            * script-src stays 'self'. The Atomic Web SDK is bundled locally as js/sdk.js and loads
              no remote script, so no Atomic host belongs here. Atomic hosts appear in connect-src
              only, which is what the SDK actually needs.
            * 'unsafe-eval' is required: the SDK compiles an icon error handler with Function() when
              an icon fails to load. Inline <script> is not allowed ('unsafe-inline' is absent).
            * https://ssl.gstatic.com is required only on Android, for TalkBack.
            * *.atomic.io in connect-src (rather than a specific *.client-api.atomic.io /
              *.client-api.staging.atomic.io pair) covers whichever API host you configure
              ATOMIC_API_HOST to in index.js - production, staging, or any other Atomic-hosted
              environment - with no CSP edit needed per environment.
            * font-src, img-src and media-src are deliberately broad: card content and stream
              container themes are authored in the Workbench and can reference assets on any host.
              Narrow them if you control which hosts your own cards use.
        -->
        <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'unsafe-eval' https://ssl.gstatic.com; style-src 'self' 'unsafe-inline'; media-src *; font-src 'self' https: data:; img-src 'self' * data: content:; frame-src blob:; connect-src https://*.atomic.io wss://*.atomic.io;">
        <meta name="format-detection" content="telephone=no">
        <meta name="msapplication-tap-highlight" content="no">
        <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover, user-scalable=no">
        <meta name="color-scheme" content="light dark">
        <link rel="stylesheet" href="css/index.css">
        <title>Hello Atomic</title>
    </head>
    <body>
        <script src="cordova.js"></script>
        <script src="js/sdk.js"></script>
        <!-- Written by `npm run generate-token`. It does not exist until you run that script; index.js falls back to
             its empty placeholder, so the app loads either way. -->
        <script src="js/token.js"></script>
        <script src="js/index.js"></script>

        <header class="app-header">
          <img class="logo-header" src="img/atomic-logo-on-light.svg" alt="Atomic"></img>
          <div id="loginControls">
            <label class="control-picker" for="variantSelect">
              Container
              <select id="variantSelect"></select>
            </label>
            <div class="login-buttons">
              <button class="modern-btn" id="loginBtn">Log in</button>
              <button class="modern-btn" id="logoutBtn" disabled>Logout</button>
            </div>
            <p class="push-status" id="pushStatus" role="status" aria-live="polite">Waiting for a push token.</p>
          </div>
        </header>

        <main class="app-content">
          <div id="single-card-host" class="container-host"></div>
          <div id="standalone-host" class="container-host"></div>
          <section class="host-page-content" aria-label="Host page content">
            <h2>Host page content</h2>
            <p>This content belongs to the host app. Stream container popovers, subviews and the launcher panel render above it, and the page stays scrollable and interactive underneath.</p>
          </section>
          <div id="horizontal-host" class="container-host"></div>
        </main>
    </body>
</html>
